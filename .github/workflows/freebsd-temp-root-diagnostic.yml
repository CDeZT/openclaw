  CONSUMER_RUN_ID: ${{ github.run_id }}
  CONSUMER_RUN_ATTEMPT: ${{ github.run_attempt }}
  PROOF_REPOSITORY: openclaw/openclaw
  PROOF_RUN_ID: "35673571733"
  PROOF_RUN_ATTEMPT: "1"
  PROOF_JOB_ID: "106575212070"
  # Authenticated successful producer run 35673571733, attempt 1.
  PAYLOAD_ARTIFACT_ID: "10671799140"
  PAYLOAD_ARTIFACT_DIGEST: "sha256:732e2c45254e4c8e23eabe47845c68f17eb40e93564bf6051a7a695c4dae8655"
