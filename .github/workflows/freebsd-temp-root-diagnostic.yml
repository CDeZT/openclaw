jobs:
  native-x64:
    if: >-
      github.repository == 'openclaw/openclaw' && github.run_attempt == 1 &&
      github.event_name == 'pull_request' && github.event.action == 'synchronize' &&
      github.event.pull_request.number == 155285 &&
      github.event.before == 'd1bf78d0108c6db492689d929411e9f299ede05a' &&
      github.event.pull_request.state == 'open' && github.event.pull_request.draft &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.repo.full_name == 'openclaw/openclaw' &&
      github.event.pull_request.head.repo.full_name == 'openclaw/openclaw' &&
      github.event.pull_request.head.ref == 'test/freebsd-temp-root-diagnostic' &&
      github.event.pull_request.user.login == 'vincentkoc'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CONSUMER_SHA }}
          fetch-depth: 7
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/install-smoke-candidate-payload.mts
            /.github/workflows/freebsd-temp-root-diagnostic.yml
      - name: Bind the sole consumer successor and successful sealed producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONSUMER_SHA"
          test "$(git show -s --format=%P HEAD)" = "$HARNESS_SHA"
          test "$(git rev-parse "$HARNESS_SHA^{tree}")" = "$PRODUCER_TREE"
          test "$(git show -s --format=%P "$HARNESS_SHA")" = c5cfc1d5d7fe4bf58364bd02ea8e3918ee176a14
          test "$(git show -s --format=%P c5cfc1d5d7fe4bf58364bd02ea8e3918ee176a14)" = 7effec872cc03fa8af9d96dc71d63123a33ab0dc
          test "$(git show -s --format=%P 7effec872cc03fa8af9d96dc71d63123a33ab0dc)" = "$SOURCE_SHA"
          test "$(git show -s --format=%P "$SOURCE_SHA")" = "$PRODUCT_SHA"
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          test "$(git rev-parse "$PRODUCT_SHA^{tree}")" = "$PRODUCT_TREE"
          test "$(git diff --name-only "$SOURCE_SHA" HEAD)" = .github/workflows/freebsd-temp-root-diagnostic.yml
          test -z "$(git status --porcelain)"
          git -c gc.auto=0 -c maintenance.auto=false fetch --no-tags --depth=1 --no-write-fetch-head origin "$WORKFLOW_SHA"
          test "$(git rev-parse "$CONSUMER_SHA:.github/workflows/freebsd-temp-root-diagnostic.yml")" = "$(git rev-parse "$WORKFLOW_SHA:.github/workflows/freebsd-temp-root-diagnostic.yml")"
          python3 - <<'AUTH'
          import hashlib,json,os,re,subprocess
          def api(path): return json.loads(subprocess.check_output(['gh','api',path]))
          for key in ['PAYLOAD_ARTIFACT_ID','PAYLOAD_ARTIFACT_SIZE']: assert re.fullmatch('[1-9][0-9]*',os.environ[key]),key
          for key in ['MANIFEST_SHA','ARCHIVE_SHA']: assert re.fullmatch('[0-9a-f]{64}',os.environ[key]),key
          assert re.fullmatch('sha256:[0-9a-f]{64}',os.environ['PAYLOAD_ARTIFACT_DIGEST'])
          assert re.fullmatch('[0-9A-Za-z][0-9A-Za-z.+-]*',os.environ['PACKAGE_VERSION'])
          patch=subprocess.check_output(['git','diff','--full-index','--no-renames','--binary',os.environ['PRODUCT_SHA'],os.environ['SOURCE_SHA']])
          assert len(patch)==22914 and hashlib.sha256(patch).hexdigest()=='9b8bad2f556f48db1dd4101a541fbdf0b4a9b874bcb01af600f70c0c4817f48a'
          repo=os.environ['PROOF_REPOSITORY'];run=api(f"repos/{repo}/actions/runs/{os.environ['PROOF_RUN_ID']}")
          assert run['head_sha']==os.environ['HARNESS_SHA'] and run['run_attempt']==int(os.environ['PROOF_RUN_ATTEMPT'])
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['path']=='.github/workflows/freebsd-temp-root-diagnostic.yml'
          job=api(f"repos/{repo}/actions/jobs/{os.environ['PROOF_JOB_ID']}")
          assert job['run_id']==run['id'] and job['head_sha']==run['head_sha'] and job['run_attempt']==run['run_attempt']
          assert job['name']=='candidate-package' and job['status']=='completed' and job['conclusion']=='success'
          artifact=api(f"repos/{repo}/actions/artifacts/{os.environ['PAYLOAD_ARTIFACT_ID']}")
          assert str(artifact['id'])==os.environ['PAYLOAD_ARTIFACT_ID'] and not artifact['expired']
          assert artifact['name']==f"freebsd-temp-diagnostic-{run['id']}-{run['run_attempt']}"
          assert artifact['workflow_run']['id']==run['id'] and artifact['workflow_run']['head_sha']==run['head_sha']
          assert artifact['size_in_bytes']==int(os.environ['PAYLOAD_ARTIFACT_SIZE']) and artifact['digest']==os.environ['PAYLOAD_ARTIFACT_DIGEST']
          print(json.dumps(dict(consumer=os.environ['CONSUMER_SHA'],workflow=os.environ['WORKFLOW_SHA'],producer=run['head_sha'],run=run['id'],attempt=run['run_attempt'],job=job['id'],artifact=artifact['id'],digest=artifact['digest'])))
          AUTH
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          repository: openclaw/openclaw
          run-id: ${{ env.PROOF_RUN_ID }}
          artifact-ids: ${{ env.PAYLOAD_ARTIFACT_ID }}
          digest-mismatch: error
          path: proof-input
          merge-multiple: true
      - name: Admit the sealed observer and relay package
        run: |
          set -euo pipefail
          python3 - <<'ADMIT'
          import json,os
          from pathlib import Path
          root=Path('proof-input');complete=json.loads((root/'complete.json').read_text())
          assert complete['complete'] is True and complete['source']==os.environ['SOURCE_SHA'] and complete['tree']==os.environ['SOURCE_TREE']
          assert complete['carrier']==os.environ['HARNESS_SHA'] and str(complete['run'])==os.environ['PROOF_RUN_ID'] and str(complete['attempt'])==os.environ['PROOF_RUN_ATTEMPT']
          assert complete['manifestSha256']==os.environ['MANIFEST_SHA'] and complete['sourceArchiveSha256']==os.environ['ARCHIVE_SHA'] and complete['packageVersion']==os.environ['PACKAGE_VERSION']
          sites=json.loads((root/'diagnostic-emission.json').read_text());assert sites['source']==os.environ['SOURCE_SHA'] and sites['complete'] and sites['emissionPassed'] and not sites['errors']
          print(json.dumps(dict(sealedProducerAccepted=True,source=complete['source'],emissionPassed=True,nativeProof='unrun')))
          ADMIT
      - name: Run the single real-finalizer case on FreeBSD x64
        uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480 # v1.5.6
        with:
          release: "15.1"
          arch: x86_64
          mem: 8192
          sync: rsync
          copyback: false
          disable-cache: true
          debug-on-error: false
          envs: SOURCE_SHA HARNESS_SHA CONSUMER_SHA CONSUMER_RUN_ID CONSUMER_RUN_ATTEMPT SOURCE_PINS EXPECTED_NODE_ARCH MANIFEST_SHA ARCHIVE_SHA PACKAGE_VERSION PAYLOAD_ARTIFACT_ID PAYLOAD_ARTIFACT_DIGEST PROOF_REPOSITORY PROOF_RUN_ID PROOF_RUN_ATTEMPT
          prepare: |
            set -eu
            mkdir -p /usr/local/etc/pkg/repos
            cat > /usr/local/etc/pkg/repos/FreeBSD.conf <<'REPO'
            FreeBSD-ports: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest" }
            REPO
            pkg install -y node24 npm-node24 corepack ca_root_nss git-lite gmake python3 bash
          run: |
            set -eu
            umask 022
            node --input-type=module <<'NODE'
            import assert from 'node:assert/strict';
            import { execFileSync } from 'node:child_process';
            const release = execFileSync('/bin/freebsd-version', ['-u'], { encoding: 'utf8' }).trim();
            assert.match(release, /^15\.1-RELEASE(?:-p\d+)?$/);
            assert.equal(process.platform, 'freebsd');
            assert.equal(process.arch, process.env.EXPECTED_NODE_ARCH);
            assert.equal(process.getuid(), 0); assert.equal(process.geteuid(), 0);
            assert.match(process.version, /^v24\./);
            console.log(JSON.stringify({ release, platform: process.platform, arch: process.arch, node: process.version, uid: process.getuid(), euid: process.geteuid() }));
            NODE
            node scripts/install-smoke-candidate-payload.mts verify               --payload-dir proof-input/payload --manifest-sha256 "$MANIFEST_SHA"               --source-archive-sha256 "$ARCHIVE_SHA" --package-version "$PACKAGE_VERSION"               --repository "$PROOF_REPOSITORY" --target-sha "$SOURCE_SHA"               --harness-repository "$PROOF_REPOSITORY" --harness-sha "$HARNESS_SHA"               --run-id "$PROOF_RUN_ID" --run-attempt "$PROOF_RUN_ATTEMPT"
            proof_root=$(mktemp -d /root/openclaw-temp-observation.XXXXXX)
            chmod 0700 "$proof_root"
            INPUT_ROOT="$(pwd)/proof-input"
            export PROOF_ROOT="$proof_root" INPUT_ROOT
            node --input-type=module <<'NODE'
            import assert from 'node:assert/strict';
            import { createHash } from 'node:crypto';
            import fs from 'node:fs';
            const root = process.env.INPUT_ROOT;
            const hash = file => createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            assert.equal(hash(`${root}/source.tar.gz`), process.env.ARCHIVE_SHA);
            console.log(JSON.stringify({source:process.env.SOURCE_SHA,consumer:process.env.CONSUMER_SHA,artifact:process.env.PAYLOAD_ARTIFACT_ID,digest:process.env.PAYLOAD_ARTIFACT_DIGEST}));
            NODE
            mkdir "$proof_root/source" "$proof_root/package-view" "$proof_root/reports"
            python3 - "$INPUT_ROOT/source.tar.gz" <<'PY'
            import json, sys, tarfile
            with tarfile.open(sys.argv[1], 'r:gz') as archive:
                members = {member.name.rstrip('/'): member for member in archive}
                for name in ['openclaw', 'openclaw/package.json']:
                    member = members[name]
                    print(json.dumps({'rawSourceArchive': name, 'uid': member.uid, 'gid': member.gid, 'mode': oct(member.mode), 'kind': 'directory' if member.isdir() else 'file' if member.isfile() else 'other'}))
            PY
            # Git archives default to group-writable modes. Apply the guest's 022
            # installation mask; root bsdtar otherwise restores the archive modes.
            tar --no-same-permissions -xzf "$INPUT_ROOT/source.tar.gz" -C "$proof_root/source"
            tar -xzf "$INPUT_ROOT/payload/candidate.tgz" -C "$proof_root/package-view"
            source_root="$proof_root/source/openclaw"
            export SOURCE_ROOT="$source_root" PACKAGED_ROOT="$proof_root/package-view/package"
            node --input-type=module <<'NODE'
            import assert from 'node:assert/strict';
            import { createHash } from 'node:crypto';
            import fs from 'node:fs';
            import path from 'node:path';
            let cursor=path.join(process.env.SOURCE_ROOT,'package.json');
            for(let ancestor=0;;ancestor++) {
              assert(ancestor<20);
              const stat=fs.lstatSync(cursor);
              console.log(JSON.stringify({installedSourceAncestor:ancestor,uid:stat.uid,gid:stat.gid,mode:(stat.mode&0o7777).toString(8),kind:stat.isDirectory()?'directory':stat.isFile()?'file':'other'}));
              assert.equal(stat.uid,0); assert.equal(stat.mode&0o022,0);
              assert(ancestor===0?stat.isFile():stat.isDirectory());
              const parent=path.dirname(cursor); if(parent===cursor) break; cursor=parent;
            }
            for (const [file, digest] of Object.entries(JSON.parse(process.env.SOURCE_PINS))) {
              assert.equal(createHash('sha256').update(fs.readFileSync(path.join(process.env.SOURCE_ROOT, file))).digest('hex'), digest, file);
            }
            const build = JSON.parse(fs.readFileSync(path.join(process.env.PACKAGED_ROOT, 'dist/build-info.json')));
            assert.equal(build.commit, process.env.SOURCE_SHA); assert(build.buildId);
            const manifest = JSON.parse(fs.readFileSync(path.join(process.env.PACKAGED_ROOT, 'package.json')));
            assert.deepEqual(manifest.openclaw.schemaVersions, { state: 17, agent:22 });
            console.log(JSON.stringify({ packageBuild: build }));
            NODE
            node --input-type=module <<'NODE'
            import assert from 'node:assert/strict';
            import fs from 'node:fs';
            import path from 'node:path';
            import { createHash } from 'node:crypto';
            const pins=JSON.parse(process.env.SOURCE_PINS), packaged=process.env.PACKAGED_ROOT;
            for (const file of ['scripts/freebsd-service-inspect.mjs','scripts/lib/freebsd-service-discovery.mjs','scripts/lib/freebsd-service-discovery.d.mts']) {
              assert.equal(createHash('sha256').update(fs.readFileSync(path.join(packaged,file))).digest('hex'),pins[file],file);
            }
            NODE
            # Archive ownership is producer metadata, not an installed root boundary.
            # Record it without changing the package; use the documented installed copy.
            node --input-type=module <<'NODE'
            import fs from 'node:fs';
            import path from 'node:path';
            const roots = { node: process.execPath, inspector: `${process.env.PACKAGED_ROOT}/scripts/freebsd-service-inspect.mjs`, helper: `${process.env.PACKAGED_ROOT}/scripts/lib/freebsd-service-discovery.mjs` };
            for (const [role, filename] of Object.entries(roots)) {
              let current='/'; let ancestor=0;
              for (const part of ['', ...filename.split('/').filter(Boolean)]) {
                current=path.join(current,part); const stat=fs.lstatSync(current);
                console.log(JSON.stringify({ownership:role,ancestor:ancestor++,uid:stat.uid,gid:stat.gid,mode:(stat.mode&0o7777).toString(8),directory:stat.isDirectory(),symlink:stat.isSymbolicLink()}));
              }
            }
            NODE
            test ! -e /usr/local/libexec/openclaw-service-inspect.mjs
            test ! -L /usr/local/libexec/openclaw-service-inspect.mjs
            test ! -e /usr/local/libexec/lib/freebsd-service-discovery.mjs
            test ! -L /usr/local/libexec/lib/freebsd-service-discovery.mjs
            install -d -o root -g wheel -m 0755 /usr/local/libexec/lib
            install -o root -g wheel -m 0644 "$PACKAGED_ROOT/scripts/freebsd-service-inspect.mjs" /usr/local/libexec/openclaw-service-inspect.mjs
            install -o root -g wheel -m 0644 "$PACKAGED_ROOT/scripts/lib/freebsd-service-discovery.mjs" /usr/local/libexec/lib/freebsd-service-discovery.mjs
            node --input-type=module <<'NODE'
            import assert from 'node:assert/strict';
            import { createHash } from 'node:crypto';
            import fs from 'node:fs';
            const pins=JSON.parse(process.env.SOURCE_PINS);
            for (const [file,installed] of [['scripts/freebsd-service-inspect.mjs','/usr/local/libexec/openclaw-service-inspect.mjs'],['scripts/lib/freebsd-service-discovery.mjs','/usr/local/libexec/lib/freebsd-service-discovery.mjs']]) {
              const stat=fs.lstatSync(installed);
              assert(stat.isFile()); assert.equal(stat.uid,0); assert.equal(stat.mode&0o7777,0o644);
              assert.equal(createHash('sha256').update(fs.readFileSync(installed)).digest('hex'),pins[file],file);
              console.log(JSON.stringify({installed:file,uid:stat.uid,gid:stat.gid,mode:(stat.mode&0o7777).toString(8),sha256:pins[file]}));
            }
            NODE
            (cd / && /usr/bin/env -i HOME=/ PATH=/sbin:/bin:/usr/sbin:/usr/bin LC_ALL=C /usr/local/bin/node /usr/local/libexec/openclaw-service-inspect.mjs) > "$proof_root/initial-discovery.json"
            node -e 'const a=require("node:assert/strict"),r=JSON.parse(require("node:fs").readFileSync(process.argv[1]));a.equal(r.status,"absent");a.equal(r.authority,"diagnostic-only")' "$proof_root/initial-discovery.json"
            export OPENCLAW_TEST_FREEBSD_DISPOSABLE=1 CI=true OPENCLAW_VITEST_MAX_WORKERS=1
            export TMPDIR="$proof_root/tmp" TMP="$proof_root/tmp" TEMP="$proof_root/tmp"
            mkdir -m 0700 "$TMPDIR"
            cd "$source_root"
              # Corepack omits optional packages and its v12 downloader rejects FreeBSD.
              # The official npm wrapper supports the installed FreeBSD x64 package.
              (cd "$PROOF_ROOT" && npm install --prefix "$PROOF_ROOT/pnpm" --ignore-scripts --include=optional --no-audit --no-fund --registry=https://registry.npmjs.org/ pnpm@12.4.0)
              node --input-type=module <<'NODE'
              import assert from 'node:assert/strict';import fs from 'node:fs';import path from 'node:path';import {pathToFileURL} from 'node:url';
              const root=path.join(process.env.PROOF_ROOT,'pnpm'),lock=JSON.parse(fs.readFileSync(path.join(root,'package-lock.json')));
              for(const [name,integrity,tarball] of [
                ['pnpm','sha512-N1NsJu1Aq0E0tlEeCfayfz67RWh0aPJAbKOAUnmk5coVjBkxNQrZd01qshCNcbPbrrOZQxWSlDdeTQU+jgVoXA==','https://registry.npmjs.org/pnpm/-/pnpm-12.4.0.tgz'],
