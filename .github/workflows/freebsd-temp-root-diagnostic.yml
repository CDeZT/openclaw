# Disposable release-preparation proof. Never merge this workflow or X instrumentation.
name: Temporary fs-safe release docs proof
on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths: [.github/workflows/freebsd-temp-root-diagnostic.yml]
permissions:
  contents: read
concurrency:
  group: freebsd-temp-root-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: false
env:
  CONSUMER_SHA: ${{ github.event.pull_request.head.sha }}
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  PREDECESSOR_SHA: 5a7a6db9644275dcb7e5342b5197a49301aabf4d
  SOURCE_X_SHA: 1388021b60cd6b87ec5bb840fdcfbd06e39f3530
  DOCS_SOURCE_SHA: 80a34f9800a75c975469d9c41ee56fa45025babb
  DOCS_SOURCE_TREE: 042a9bd0b07ba725e5be315ba1e17973b7294404
  INPUT_MANIFEST_SHA: 6ee246fe1bc84b316e8e0c1f674e2ed7d3c36fe0d92013afd7046d1845522766
jobs:
  release-docs:
    if: >-
      github.repository == 'openclaw/openclaw' && github.run_attempt == 1 &&
      github.event_name == 'pull_request' && github.event.action == 'synchronize' &&
      github.event.pull_request.number == 155285 &&
      github.event.before == '5a7a6db9644275dcb7e5342b5197a49301aabf4d' &&
      github.event.pull_request.state == 'open' && github.event.pull_request.draft &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.repo.full_name == 'openclaw/openclaw' &&
      github.event.pull_request.head.repo.full_name == 'openclaw/openclaw' &&
      github.event.pull_request.head.ref == 'test/freebsd-temp-root-diagnostic' &&
      github.event.pull_request.user.login == 'vincentkoc'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CONSUMER_SHA }}
          fetch-depth: 9
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /.github/workflows/freebsd-temp-root-diagnostic.yml
      - name: Authenticate the sole workflow successor
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONSUMER_SHA"
          test "$(git show -s --format=%P HEAD)" = "$PREDECESSOR_SHA"
          test "$(git rev-parse "$PREDECESSOR_SHA^{tree}")" = 4fd1352f6da5c9987956977e061a07285cb6fe59
          test "$(git diff --name-only "$SOURCE_X_SHA" HEAD)" = .github/workflows/freebsd-temp-root-diagnostic.yml
          test -z "$(git status --porcelain)"
          git -c gc.auto=0 -c maintenance.auto=false fetch --no-tags --depth=1 --no-write-fetch-head origin "$WORKFLOW_SHA"
          test "$(git rev-parse "$CONSUMER_SHA:.github/workflows/freebsd-temp-root-diagnostic.yml")" = "$(git rev-parse "$WORKFLOW_SHA:.github/workflows/freebsd-temp-root-diagnostic.yml")"
          mkdir -m 700 evidence
      - name: Check out the exact fs-safe release proposal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/fs-safe
          ref: ${{ env.DOCS_SOURCE_SHA }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Authenticate docs and command inputs
        id: inputs
        working-directory: candidate
        run: |
          set -euo pipefail
          cat > ../evidence/verify-inputs.py <<'INPUTS'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')==os.environ['DOCS_SOURCE_SHA']
          assert git('rev-parse','HEAD^{tree}')==os.environ['DOCS_SOURCE_TREE']
          subprocess.run(['git','diff','--exit-code','HEAD'],check=True)
          keys=['package.json','pnpm-lock.yaml','pnpm-workspace.yaml','scripts/build-docs-site.mjs','scripts/docs-site-assets.mjs','scripts/docs-site-navigation.mjs']
          for p in Path('docs').rglob('*'):
              assert not p.is_symlink(),str(p)
              if p.is_file():keys.append(p.as_posix())
          if Path('CNAME').exists():keys.append('CNAME')
          rows=[]
          for name in sorted(keys):
              p=Path(name);assert p.is_file() and not p.is_symlink()
              content=p.read_bytes();rows.append(dict(path=name,bytes=len(content),sha256=hashlib.sha256(content).hexdigest()))
          raw=(json.dumps(rows,separators=(',',':'))+'\n').encode()
          assert len(rows)==65 and hashlib.sha256(raw).hexdigest()==os.environ['INPUT_MANIFEST_SHA']
          package=json.loads(Path('package.json').read_text())
          assert package['version']=='0.18.1' and package['packageManager']=='pnpm@12.4.2'
          assert package['scripts']['docs:site']=='node scripts/build-docs-site.mjs'
          Path('../evidence/inputs-'+sys.argv[1]+'.json').write_bytes(raw)
          print(json.dumps(dict(stage=sys.argv[1],repository='openclaw/fs-safe',source=os.environ['DOCS_SOURCE_SHA'],tree=os.environ['DOCS_SOURCE_TREE'],consumer=os.environ['CONSUMER_SHA'],workflow=os.environ['WORKFLOW_SHA'],inputFiles=len(rows),inputManifestSha256=hashlib.sha256(raw).hexdigest())))
          INPUTS
          python3 ../evidence/verify-inputs.py before
          test ! -e dist/docs-site
          test ! -e node_modules
      - name: Set up supported Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Set up pinned pnpm without a workspace install
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          package_json_file: candidate/package.json
          run_install: false
      - name: Run the canonical docs command once
        id: docs
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.21.0
          test "$(pnpm --version)" = 12.4.2
          node --input-type=module <<'COMMAND'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {spawnSync} from 'node:child_process';
          assert.equal(process.platform,'linux');assert.equal(process.arch,'x64');
          const started=new Date().toISOString(),begin=process.hrtime.bigint();
          const child=spawnSync('pnpm',['docs:site'],{stdio:'inherit'});
          const receipt={repository:'openclaw/fs-safe',source:process.env.DOCS_SOURCE_SHA,tree:process.env.DOCS_SOURCE_TREE,consumer:process.env.CONSUMER_SHA,run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,command:['pnpm','docs:site'],started,finished:new Date().toISOString(),wallNanoseconds:(process.hrtime.bigint()-begin).toString(),node:process.version,pnpm:'12.4.2',platform:process.platform,arch:process.arch,status:child.status,signal:child.signal,spawnError:child.error?.code??null,scope:'canonical static docs build; no package build, workspace install, deployment or release'};
          let status=child.status===0&&!child.signal&&!child.error?0:(child.status||1);
          try{fs.writeFileSync('../evidence/command.json',JSON.stringify(receipt)+'\n');console.log(JSON.stringify(receipt));}catch(error){console.error(error);if(status===0)status=1;}
          process.exitCode=status;
          COMMAND
      - name: Verify every expected site output
        if: ${{ success() && steps.docs.outcome == 'success' }}
        working-directory: candidate
        run: |
          python3 - <<'OUTPUT'
          import hashlib,json,os,re
          from pathlib import Path
          root=Path('dist/docs-site');assert root.is_dir() and not root.is_symlink()
          pages=sorted(p.relative_to('docs').with_suffix('.html').as_posix() for p in Path('docs').rglob('*.md'))
          assert len(pages)==54 and len(set(pages))==54
          assets=['.nojekyll','CNAME','favicon.svg','llms.txt','social-card.png','social-card.svg']
          files=[]
          for p in root.rglob('*'):
              assert not p.is_symlink()
              if p.is_file():files.append(p.relative_to(root).as_posix())
          assert sorted(files)==sorted(pages+assets)
          for rel in pages:
              html=(root/rel).read_text()
              assert html.startswith('<!doctype html>') and '<html lang="en">' in html and '<title>' in html and '</html>' in html
              assert re.search(r'<link rel="canonical" href="https://fs-safe\.io/',html)
          assert (root/'.nojekyll').read_bytes()==b''
          assert (root/'CNAME').read_text()=='fs-safe.io'
          for asset in ['social-card.png','social-card.svg']:assert (root/asset).read_bytes()==(Path('docs')/asset).read_bytes()
          assert '<svg' in (root/'favicon.svg').read_text()
          index=(root/'llms.txt').read_text();assert index.startswith('# fs-safe\n')
          urls=re.findall(r'^- [^\n]+: (https://fs-safe\.io/[^\n]*)$',index,re.M)
          assert sorted(urls)==sorted('https://fs-safe.io/'+('' if p=='index.html' else p) for p in pages)
          rows=[dict(path=p,bytes=len((root/p).read_bytes()),sha256=hashlib.sha256((root/p).read_bytes()).hexdigest()) for p in sorted(files)]
          raw=(json.dumps(rows,separators=(',',':'))+'\n').encode();Path('../evidence/site-inventory.json').write_bytes(raw)
          receipt=dict(source=os.environ['DOCS_SOURCE_SHA'],htmlPages=len(pages),assets=len(assets),files=len(files),inventorySha256=hashlib.sha256(raw).hexdigest(),localLinksAndAnchors='canonical builder validated',outcome='passed')
          Path('../evidence/output.json').write_text(json.dumps(receipt)+'\n');print(json.dumps(receipt))
          OUTPUT
      - name: Verify source and inputs after either command outcome
        if: ${{ always() && steps.inputs.outcome == 'success' }}
        working-directory: candidate
        run: |
          set -euo pipefail
          python3 ../evidence/verify-inputs.py after
          test ! -e node_modules
          git diff --check
      - name: Retain the bounded proof records on either outcome
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fs-safe-release-docs-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/*.json
          if-no-files-found: warn
          retention-days: 7
