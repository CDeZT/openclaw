# Disposable FreeBSD x64 diagnostic consumer. Never merge this workflow or its source.
name: Temporary FreeBSD temp-root diagnostic consumer
on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths: [.github/workflows/freebsd-temp-root-diagnostic.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: freebsd-temp-root-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: false
env:
  SOURCE_SHA: 1388021b60cd6b87ec5bb840fdcfbd06e39f3530
  SOURCE_TREE: 282fcc4a3ee7d7af39c51fb39b97ca3545dff873
  PRODUCT_SHA: 10725d8613c64f5efdc8ea58eae70a3b8f4276ac
  PRODUCT_TREE: 74bddc0882c455c519931e40040c260df9951ee8
