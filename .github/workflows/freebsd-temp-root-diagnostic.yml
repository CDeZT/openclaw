# Disposable diagnostic derivative. Never merge this workflow or its instrumented source.
name: Temporary FreeBSD temp-root diagnostic producer
on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths: [.github/workflows/freebsd-temp-root-diagnostic.yml]
permissions:
  contents: read
concurrency:
  group: freebsd-temp-root-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  candidate-package:
    if: >-
      github.repository == 'openclaw/openclaw' && github.run_attempt == 1 &&
      github.event_name == 'pull_request' && github.event.action == 'synchronize' &&
      github.event.pull_request.number == 155285 &&
      github.event.before == '7effec872cc03fa8af9d96dc71d63123a33ab0dc' &&
      github.event.pull_request.state == 'open' && github.event.pull_request.draft &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.repo.full_name == 'openclaw/openclaw' &&
      github.event.pull_request.head.repo.full_name == 'openclaw/openclaw' &&
      github.event.pull_request.head.ref == 'test/freebsd-temp-root-diagnostic' &&
      github.event.pull_request.user.login == 'vincentkoc'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=8192
      OPENCLAW_VITEST_MAX_WORKERS: "2"
      CANDIDATE_SHA: 1388021b60cd6b87ec5bb840fdcfbd06e39f3530
      CANDIDATE_TREE: 282fcc4a3ee7d7af39c51fb39b97ca3545dff873
      PRODUCT_SHA: 10725d8613c64f5efdc8ea58eae70a3b8f4276ac
      PRODUCT_TREE: 74bddc0882c455c519931e40040c260df9951ee8
      PREVIOUS_CARRIER_SHA: 7effec872cc03fa8af9d96dc71d63123a33ab0dc
      PREVIOUS_CARRIER_TREE: 1cb3a786afe727743a5e991bfb29ebe3057a3172
      CARRIER_SHA: ${{ github.event.pull_request.head.sha }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 6
          persist-credentials: false
      - name: Bind the diagnostic derivative and sole workflow carrier
        run: |
          set -euo pipefail
          [[ "$CARRIER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CARRIER_SHA"
          test "$(git show -s --format=%P HEAD)" = "$PREVIOUS_CARRIER_SHA"
          test "$(git rev-parse "$PREVIOUS_CARRIER_SHA^{tree}")" = "$PREVIOUS_CARRIER_TREE"
          test "$(git show -s --format=%P "$PREVIOUS_CARRIER_SHA")" = "$CANDIDATE_SHA"
          test "$(git show -s --format=%P "$CANDIDATE_SHA")" = "$PRODUCT_SHA"
          test "$(git rev-parse "$CANDIDATE_SHA^{tree}")" = "$CANDIDATE_TREE"
          test "$(git rev-parse "$PRODUCT_SHA^{tree}")" = "$PRODUCT_TREE"
          test "$(git show -s --format=%P "$PRODUCT_SHA")" = "67214ac792717ee72cee7a4ae32b678ff12663fd a7c27c04a3d6e797b8974ad6ee22724724918e8a"
          test "$(git diff --name-only "$CANDIDATE_SHA" HEAD)" = .github/workflows/freebsd-temp-root-diagnostic.yml
          test -z "$(git status --porcelain)"
          git -c gc.auto=0 -c maintenance.auto=false fetch --no-tags --depth=1 --no-write-fetch-head origin "$WORKFLOW_SHA"
          test "$(git rev-parse "$CARRIER_SHA:.github/workflows/freebsd-temp-root-diagnostic.yml")" = "$(git rev-parse "$WORKFLOW_SHA:.github/workflows/freebsd-temp-root-diagnostic.yml")"
          mkdir "$RUNNER_TEMP/freebsd-temp-diagnostic-proof"
          python3 - <<'BIND'
          import hashlib, json, os, subprocess
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git', *args])
          product,candidate=os.environ['PRODUCT_SHA'],os.environ['CANDIDATE_SHA']
          patch=git('diff','--full-index','--no-renames','--binary',product,candidate)
          assert len(patch)==22914
          assert hashlib.sha256(patch).hexdigest()=='9b8bad2f556f48db1dd4101a541fbdf0b4a9b874bcb01af600f70c0c4817f48a'
          paths=git('diff','--name-only',product,candidate).decode().splitlines()
          expected=['src/cli/update-cli/update-command-fresh-doctor.ts','src/config/io.snapshot.ts']
          assert paths==expected
          receipt=dict(product=product,productTree=os.environ['PRODUCT_TREE'],candidate=candidate,candidateTree=os.environ['CANDIDATE_TREE'],
              patchSha256=hashlib.sha256(patch).hexdigest(),paths=paths,carrier=os.environ['CARRIER_SHA'],workflow=os.environ['WORKFLOW_SHA'],
              previousCarrier=os.environ['PREVIOUS_CARRIER_SHA'],eventMerge=os.environ['GITHUB_SHA'],run=os.environ['GITHUB_RUN_ID'],attempt=os.environ['GITHUB_RUN_ATTEMPT'],
              scope='temporary closed cause and role-only filesystem observations; not a shipping repair or native qualification')
          Path(os.environ['RUNNER_TEMP'],'freebsd-temp-diagnostic-proof','source-binding.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt))
          BIND
      - name: Prepare the canonical Git lifecycle owner
        uses: ./.github/actions/git-owner
      - name: Set up one frozen toolchain without a harness dependency install
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          install-bun: "false"
          install-deps: "false"
          cache-mode: "off"
      - name: Create one isolated product root and frozen dependency install
        run: |
          set -euo pipefail
          test "$(node -p process.versions.node)" = 24.21.0
          test "$(pnpm --version)" = 12.4.0
          test ! -e node_modules
          python3 -I -S "$CI_GIT_OWNER" --git 120 worktree add --detach "$RUNNER_TEMP/freebsd-temp-candidate" "$CANDIDATE_SHA"
          cd "$RUNNER_TEMP/freebsd-temp-candidate"
          CI=true DEPENDENCY_CACHE=false DEPENDENCY_CACHE_HIT=false FROZEN_LOCKFILE=true \
            bash .github/actions/setup-node-env/install-dependencies.sh
          git diff --exit-code
          git diff --cached --exit-code
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'; import fs from 'node:fs'; import os from 'node:os'; import path from 'node:path';
          import {createHash} from 'node:crypto'; import {execFileSync} from 'node:child_process'; import {createRequire} from 'node:module';
          const root=process.cwd(),sha=b=>createHash('sha256').update(b).digest('hex');
          const fingerprint=execFileSync(process.execPath,[`${root}/.github/actions/setup-node-env/dependency-fingerprint.mjs`,'--workspace',root,'--frozen-lockfile','true'],{encoding:'utf8'}).trim();
          assert(!fs.lstatSync(`${root}/node_modules`).isSymbolicLink());
          assert.equal(process.platform,'linux'); assert.equal(process.arch,'x64');
          assert(process.report.getReport().header.glibcVersionRuntime,'this producer requires the selected GNU native package');
          const require=createRequire(`${root}/package.json`),fsSafeMeta=require.resolve('@openclaw/fs-safe/package.json');
          const fsSafeRoot=path.dirname(fs.realpathSync(fsSafeMeta)),meta=JSON.parse(fs.readFileSync(fsSafeMeta));
          assert.equal(meta.name,'@openclaw/fs-safe'); assert.equal(meta.version,'0.18.0');
          const nativeNames=['darwin-arm64','darwin-x64','linux-arm64-gnu','linux-arm64-musl','linux-x64-gnu','linux-x64-musl','win32-x64-msvc'].map(t=>`@openclaw/fs-safe-${t}`);
          assert.deepEqual(Object.keys(meta.optionalDependencies).filter(n=>n.startsWith('@openclaw/fs-safe-')).sort(),nativeNames.toSorted());
          for(const name of nativeNames) assert.equal(meta.optionalDependencies[name],'0.18.0');
          const nativeName='@openclaw/fs-safe-linux-x64-gnu';
          const nativeEntry=fs.realpathSync(createRequire(fsSafeMeta).resolve(nativeName));
          let nativeRoot=path.dirname(nativeEntry);
          while(!fs.existsSync(path.join(nativeRoot,'package.json'))) { const parent=path.dirname(nativeRoot); assert.notEqual(parent,nativeRoot); nativeRoot=parent; }
          const nativeMeta=JSON.parse(fs.readFileSync(path.join(nativeRoot,'package.json')));
          assert.equal(nativeMeta.name,nativeName); assert.equal(nativeMeta.version,'0.18.0');
          function inventory(directory) {
            const files=[];
            function walk(relative) {
              for(const name of fs.readdirSync(path.join(directory,relative)).sort()) {
                if(name==='node_modules') continue;
                const member=path.join(relative,name),file=path.join(directory,member),stat=fs.lstatSync(file);
                assert(!stat.isSymbolicLink(),`unexpected package symlink: ${member}`);
                if(stat.isDirectory()) walk(member);
                else { assert(stat.isFile()); files.push({path:member,bytes:stat.size,sha256:sha(fs.readFileSync(file))}); }
              }
            }
            walk(''); assert(files.length>0); return {files,inventorySha256:sha(JSON.stringify(files))};
          }
          const fsSafe=inventory(fsSafeRoot),native=inventory(nativeRoot);
          for(const file of ['package.json','dist/advanced.js','dist/native.js','dist/file-hash.js']) assert(fsSafe.files.some(f=>f.path===file));
          assert(native.files.some(f=>f.path.endsWith('.node')));
          const inputPaths=['package.json','pnpm-lock.yaml','pnpm-workspace.yaml',...['file-transfer','llama-cpp','migrate-claude','onepassword','openshell','signal'].map(n=>`extensions/${n}/package.json`)];
          const inputs=Object.fromEntries(inputPaths.map(p=>[p,sha(fs.readFileSync(p))]));
          const receipt={source:process.env.CANDIDATE_SHA,node:process.versions.node,pnpm:execFileSync('pnpm',['--version'],{encoding:'utf8'}).trim(),
            platform:process.platform,arch:process.arch,cpus:os.cpus().length,memory:os.totalmem(),dependencyFingerprint:fingerprint,
            toolchainSha256:sha(fs.readFileSync(process.execPath)),inputs,
            fsSafe:{version:meta.version,...fsSafe},native:{name:nativeName,version:nativeMeta.version,entry:path.relative(nativeRoot,nativeEntry),...native},
            scope:'actual frozen producer install; final operator dependency custody remains separate'};
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/freebsd-temp-diagnostic-proof/toolchain.json`,JSON.stringify(receipt,null,2)+'\n',{flag:'wx'});
          console.log(JSON.stringify(receipt));
          NODE
      - name: Build the final canonical package once
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/freebsd-temp-candidate"
          node scripts/package-openclaw-for-docker.mjs --allow-unreleased-changelog \
            --output-dir "$RUNNER_TEMP/freebsd-temp-candidate-package" --output-name candidate.tgz \
            --pack-json "$RUNNER_TEMP/freebsd-temp-candidate-pack.json"
          git diff --exit-code
          git diff --cached --exit-code
      - name: Authenticate actual observer and relay package bytes
        run: |
          set -euo pipefail
          python3 - <<'EMIT'
          import hashlib,json,os,sys,tarfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['RUNNER_TEMP']);proof=root/'freebsd-temp-diagnostic-proof'
          package=root/'freebsd-temp-candidate-package/candidate.tgz'
          inventory=dict(source=os.environ['CANDIDATE_SHA'],complete=False,modules=[],candidates=[],errors=[])
          packages=[];stage='archive';current=None
          try:
              with tarfile.open(package,'r:gz') as archive:
                  members=archive.getmembers();names=[member.name for member in members]
                  stage='unique-members';assert len(names)==len(set(names))
                  for member in members:
                      current=member.name;parts=PurePosixPath(current).parts;stage='safe-member'
                      assert not current.startswith('/') and '\\' not in current and '..' not in parts and parts[0]=='package'
                  def read(name):
                      matches=[member for member in members if member.name=='package/'+name]
                      assert len(matches)==1 and matches[0].isfile()
                      return archive.extractfile(matches[0]).read()
                  stage='package-contract';current=None
                  meta=json.loads(read('package.json'));build=json.loads(read('dist/build-info.json'))
                  assert build['commit']==os.environ['CANDIDATE_SHA']
                  assert meta['dependencies']['@openclaw/fs-safe']=='0.18.0'
                  finalizer='dist/infra/update-migrated-finalize.worker.js'
                  worker=read(finalizer)
                  assert worker==(root/'freebsd-temp-candidate'/finalizer).read_bytes()
                  packages=[dict(role='candidate',source=os.environ['CANDIDATE_SHA'],build=build,
                      packageBytes=package.stat().st_size,packageSha256=hashlib.file_digest(package.open('rb'),'sha256').hexdigest(),
                      finalizer=dict(file=finalizer,bytes=len(worker),sha256=hashlib.sha256(worker).hexdigest()),fsSafe=meta['dependencies']['@openclaw/fs-safe'])]
                  for member in members:
                      current=member.name
                      if not current.startswith('package/dist/') or PurePosixPath(current).suffix not in {'.js','.mjs'}: continue
                      stage='regular-javascript';assert member.isfile()
                      stage='read-package-member';data=archive.extractfile(member).read();relative=current.removeprefix('package/')
                      marker=b'OPENCLAW_FREEBSD_TEMP_DIAGNOSTIC_V1 ' in data
                      item=dict(file=relative,bytes=len(data),sha256=hashlib.sha256(data).hexdigest(),markerCandidate=marker)
                      inventory['modules'].append(item)
                      if not marker: continue
                      candidate=dict(**item,packageBuildEqual=False,retention='bounded-excerpts-only')
                      inventory['candidates'].append(candidate)
                      try:
                          built=(root/'freebsd-temp-candidate'/relative).read_bytes()
                          candidate['packageBuildEqual']=data==built
                          candidate['buildBytes']=len(built);candidate['buildSha256']=hashlib.sha256(built).hexdigest()
                          candidate['condition']='verified' if candidate['packageBuildEqual'] else 'package-build-mismatch'
                      except OSError:
                          candidate['condition']='build-read-failed'
              inventory['complete']=True
          except Exception:
              inventory['errors'].append(dict(stage=stage,code='collector-failed',member=current if stage!='safe-member' else None))
          finally:
              try:
                  (proof/'diagnostic-module-inventory.json').write_text(json.dumps(inventory,indent=2)+'\n')
                  (proof/'packages.json').write_text(json.dumps(packages,indent=2)+'\n')
              except Exception:
                  print(json.dumps(dict(stage='inventory-write',code='collector-failed')))
                  raise SystemExit(1)
          print(json.dumps(dict(complete=inventory['complete'],packages=packages,runtimeModules=len(inventory['modules']),diagnosticCandidates=inventory['candidates'],errors=inventory['errors'])))
          if not inventory['complete']: sys.exit(1)
          EMIT
          node --input-type=module <<'EMIT'
          import assert from 'node:assert/strict';import fs from 'node:fs';import {createRequire} from 'node:module';import {createHash} from 'node:crypto';
          const require=createRequire(`${process.env.RUNNER_TEMP}/freebsd-temp-candidate/package.json`),{parse}=require('acorn');
          const dir=`${process.env.RUNNER_TEMP}/freebsd-temp-diagnostic-proof`,sha=b=>createHash('sha256').update(b).digest('hex');
          const MAX_DEBUG_BYTES=256*1024,MAX_EXCERPT_BYTES=64*1024;
          let retainedBytes=0;
          const observed=new Set(),result={source:process.env.CANDIDATE_SHA,complete:false,emissionPassed:false,receipts:[],errors:[],debug:{maxBytes:MAX_DEBUG_BYTES,retainedBytes:0,excerpts:[]},scope:'actual packaged observer and relay sites; native failure reproduction remains unrun'};
          const marker='OPENCLAW_FREEBSD_TEMP_DIAGNOSTIC_V1 ';
          const member=(n,object,property)=>n?.type==='MemberExpression'&&!n.computed&&n.object?.type==='Identifier'&&n.object.name===object&&n.property?.name===property;
          const builtinFs=n=>n?.type==='CallExpression'&&member(n.callee,'process','getBuiltinModule')&&n.arguments[0]?.value==='node:fs';
          function walk(node,fn) {
            if(!node||typeof node!=='object')return;fn(node);
            for(const value of Object.values(node))if(Array.isArray(value))value.forEach(n=>walk(n,fn));else if(value&&typeof value==='object')walk(value,fn);
          }
          function outputMarker(n,init,seen=new Set()) {
            if(!n)return false;
            if(n.type==='Literal')return typeof n.value==='string'&&n.value.includes(marker);
            if(n.type==='Identifier') {
              if(seen.has(n.name))return false;
              return outputMarker(init(n.name),init,new Set([...seen,n.name]));
            }
            if(n.type==='TemplateLiteral')return n.quasis.some(q=>(q.value.cooked??q.value.raw).includes(marker))||n.expressions.some(value=>outputMarker(value,init,seen));
            return n.type==='BinaryExpression'&&n.operator==='+'&&(outputMarker(n.left,init,seen)||outputMarker(n.right,init,seen));
          }
          function excerpt(bytes,source,file,bundleSha,start,end,kind) {
            const byteStart=Buffer.byteLength(source.slice(0,start),'utf8'),byteEnd=Buffer.byteLength(source.slice(0,end),'utf8');
            const slice=bytes.subarray(byteStart,byteEnd);assert(slice.equals(Buffer.from(source.slice(start,end),'utf8')));
            const item={file,fullBundleBytes:bytes.length,fullBundleSha256:bundleSha,kind,utf16Start:start,utf16End:end,byteStart,byteEnd,bytes:slice.length,sha256:sha(slice)};
            if(slice.length>MAX_EXCERPT_BYTES)item.omission='excerpt-size';
            else if(retainedBytes+slice.length>MAX_DEBUG_BYTES)item.omission='total-debug-budget';
            else {item.text=slice.toString('utf8');retainedBytes+=slice.length;item.omission=null;}
            result.debug.excerpts.push(item);
          }
          try {
            const inventory=JSON.parse(fs.readFileSync(`${dir}/diagnostic-module-inventory.json`));
            assert.equal(inventory.complete,true);assert.equal(inventory.source,process.env.CANDIDATE_SHA);
            for(const candidate of inventory.candidates) {
              const receipt={...candidate,parsed:false,classification:'unclassified',markerWrites:0,sites:[],errors:[]};result.receipts.push(receipt);
              let stage='read-build',bytes,source,bundleSha;
              const fail=code=>receipt.errors.push({stage,code});
              try {
                bytes=fs.readFileSync(`${process.env.RUNNER_TEMP}/freebsd-temp-candidate/${candidate.file}`);bundleSha=sha(bytes);
                stage='package-build-identity';
                if(!candidate.packageBuildEqual||bytes.length!==candidate.bytes||bundleSha!==candidate.sha256)fail('package-build-mismatch');
                source=bytes.toString('utf8');assert(Buffer.from(source,'utf8').equals(bytes));
                stage='ast-parse';const ast=parse(source,{ecmaVersion:'latest',sourceType:'module'}),owners=new Map();
                receipt.parsed=true;stage='ast-check';
                function visit(n,ancestors=[]) {
                  if(!n||typeof n!=='object')return;
                  const callee=n.callee;
                  if(n.type==='CallExpression'&&callee?.type==='MemberExpression'&&!callee.computed&&callee.property?.name==='writeSync'&&n.arguments[1]?.type==='Identifier') {
                    const owner=ancestors.findLast(a=>a.type==='TryStatement');
                    if(owner) {
                      const declarations=new Map();
                      walk(owner.block,d=>{if(d.type==='VariableDeclarator'&&d.id.type==='Identifier'){const values=declarations.get(d.id.name)??[];values.push(d.init);declarations.set(d.id.name,values)}});
                      const init=name=>declarations.get(name)?.length===1?declarations.get(name)[0]:undefined;
                      const fsOwner=callee.object.type==='Identifier'?init(callee.object.name):callee.object;
                      const output=init(n.arguments[1].name);
                      const bounded=ancestors.some(a=>a.type==='IfStatement'&&a.test?.type==='BinaryExpression'&&a.test.operator==='<='&&a.test.right?.value===8192&&a.test.left?.type==='CallExpression'&&member(a.test.left.callee,'Buffer','byteLength')&&a.test.left.arguments[0]?.name===n.arguments[1].name);
                      if(outputMarker(output,init)) {
                        receipt.markerWrites++;owners.set(`${owner.start}:${owner.end}`,owner);
                        if(!builtinFs(fsOwner))fail('builtin-fs-writer-missing');
                        if(n.arguments[0]?.value!==2)fail('stderr-descriptor-missing');
                        if(!bounded)fail('output-bound-missing');
                        const origins=new Set();
                        walk(output,d=>{
                          if(d.type!=='CallExpression'||!member(d.callee,'JSON','stringify')||d.arguments[0]?.type!=='Identifier')return;
                          const record=init(d.arguments[0].name);
                          if(record?.type!=='ObjectExpression')return;
                          const origin=record.properties.find(p=>p.type==='Property'&&!p.computed&&(p.key.name??p.key.value)==='origin')?.value?.value;
                          if(['config-snapshot','config-validator-relay'].includes(origin))origins.add(origin);
                        });
                        if(!origins.size)fail('fixed-origin-missing');
                        if(builtinFs(fsOwner)&&n.arguments[0]?.value===2&&bounded)for(const origin of origins){receipt.sites.push({origin,writeStart:n.start,writeEnd:n.end,maxBytes:8192});observed.add(origin)}
                      }
                    }
                  }
                  const next=[...ancestors,n];
                  for(const value of Object.values(n))if(Array.isArray(value))value.forEach(v=>visit(v,next));else if(value&&typeof value==='object')visit(value,next);
                }
                visit(ast);receipt.classification=receipt.markerWrites?'executable-diagnostic':'marker-only';
                stage='debug-excerpt';
                for(const owner of owners.values())excerpt(bytes,source,candidate.file,bundleSha,owner.start,owner.end,'owner-try');
                for(const site of receipt.sites)excerpt(bytes,source,candidate.file,bundleSha,site.writeStart,site.writeEnd,`write:${site.origin}`);
              } catch(error) {
                receipt.errors.push({stage,code:'collector-failed',...(stage==='ast-parse'&&Number.isSafeInteger(error?.pos)?{utf16Position:error.pos}:{})});
                if(stage==='ast-parse'&&source!==undefined) {
                  const position=Number.isSafeInteger(error?.pos)?Math.min(source.length,Math.max(0,error.pos)):0;
                  try {excerpt(bytes,source,candidate.file,bundleSha,Math.max(0,position-256),Math.min(source.length,position+256),'parse-error-context');}
                  catch {fail('debug-excerpt-failed');}
                }
              }
              result.errors.push(...receipt.errors.map(error=>({file:candidate.file,...error})));
            }
            for(const origin of ['config-snapshot','config-validator-relay'])if(!observed.has(origin))result.errors.push({stage:'origin-coverage',code:'required-origin-missing',origin});
            result.complete=true;
          } catch {result.errors.push({stage:'collector-input',code:'collector-failed'});}
          finally {
            result.debug.retainedBytes=retainedBytes;result.emissionPassed=result.complete&&result.errors.length===0;
            try {fs.writeFileSync(`${dir}/diagnostic-emission.json`,JSON.stringify(result,null,2)+'\n',{flag:'wx'});}
            catch {result.errors.push({stage:'receipt-write',code:'collector-failed'});result.emissionPassed=false;}
          }
          console.log(JSON.stringify({emissionPassed:result.emissionPassed,complete:result.complete,receipts:result.receipts,debugRetainedBytes:retainedBytes,errors:result.errors}));
          if(!result.emissionPassed)process.exitCode=1;
          EMIT
      - name: Seal the diagnostic package for a separately reviewed native consumer
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/freebsd-temp-candidate"
          proof="$RUNNER_TEMP/freebsd-temp-diagnostic-proof"
          git archive --format=tar.gz --prefix=openclaw/ "$CANDIDATE_SHA" > "$proof/source.tar.gz"
          node scripts/install-smoke-candidate-payload.mts seal \
            --archive "$proof/source.tar.gz" --package-dir "$RUNNER_TEMP/freebsd-temp-candidate-package" \
            --output-dir "$proof/payload" --repository "$GITHUB_REPOSITORY" --target-sha "$CANDIDATE_SHA" \
            --harness-repository "$GITHUB_REPOSITORY" --harness-sha "$CARRIER_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          git diff --exit-code
          git diff --cached --exit-code
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import fs from 'node:fs';import {createHash} from 'node:crypto';
          const dir=`${process.env.RUNNER_TEMP}/freebsd-temp-diagnostic-proof`,sha=f=>createHash('sha256').update(fs.readFileSync(f)).digest('hex');
