  MANIFEST_SHA: "21902bc002cceafc66ce6f3a6da5e95a0872267aa56b8876dca4221bc2fc6cb0"
  ARCHIVE_SHA: "3580f587a467a1a9aa6c5b552e1ec67b9398f94d9b16ee5c24467144655bfc1f"
  PACKAGE_VERSION: "2026.9.5"
  EXPECTED_NODE_ARCH: x64
  SOURCE_PINS: '{".npmrc":"f1d021e2abdf8817d83e35feb1f5d604e8c985aa0553bec3d417cf6f93e9c09c","package.json":"f5c0f02e39c7d57eac8d62ca0ee32a0fe6d785ddfd311a41cb5f63a0b5101d59","pnpm-lock.yaml":"799277c5164659f2698c8ee815cdc2083e290e5682b8a1877cb57efcda919180","pnpm-workspace.yaml":"d6e830d59ad6802154c01aae2525444f257915b68cc3956fbc574efc2160ba6b","packages/ai/package.json":"61eefcb38095a41de445f781c738cb1f89c960ddf6c56f39c6d61970d8db277b","packages/markdown-core/package.json":"eb934f4829a87292edff90480e2c060e636afdd75d35a3ffc02a55581e37a548","packages/model-catalog-core/package.json":"0cef9224746d0eed66278f729b6edf4d6e7cdf31fd35b16af62bae0aa4635331","packages/normalization-core/package.json":"2bfc2ae79211db8023b168e8dd6c5f378dd64e0890b32ae9a043d38c867683a5","packages/session-url-contract/package.json":"ce05f27abdafc0ff033aadf0d0944f8c48681d5eebcd5dec7485e64215abe827","scripts/install-smoke-candidate-payload.mts":"5f4de9d36236a4f23d769e0972a0f0904864711ff664ba3fad362137dc3902ac","scripts/run-vitest.mjs":"c3590ff935f53512a6faf3455da5e02f914fc9cbf94c5fdc962d40fbe7f5a459","scripts/tsx.mjs":"e726c78d5a5a274215d9fe292ac91e4acf601c4554d68fbd57ff3b932573f9e6","scripts/lib/vitest-report-capture.mts":"efed891ab104940d6342fa902306809dc714083be53b73a1970d22a12a10a2a2","scripts/lib/vitest-worker-compiler.mts":"eeab9138dbfa6dc9336b70ac17aaf63646925e246a3da8d9e7c8e289014142af","scripts/lib/vitest-worker-artifacts.mts":"b8f30e2869db28ef1ba76139434e674fdd6381caafefb7396384ad5e82a5cefc","scripts/lib/vitest-worker-run.mts":"0144339d75a27d6b8a9643fa22a46dcc346f4ee387c96b4039b2ee22bd0a1433","scripts/lib/vitest-build-prerequisites.mts":"20ee2cb09d66dd98f38292eb90fafea0b897493182857b604d61ff472e030ed7","scripts/freebsd-service-inspect.mjs":"6585523afc1b700b82b53e4b9881944a0f3d58f2dd47c5675252ec658a3a8f4d","scripts/lib/freebsd-service-discovery.mjs":"a18f1ba7022576545571ef033a0060c83343d8a047e380aec15e3dc0543e0d19","scripts/lib/freebsd-service-discovery.d.mts":"efb110b8164077569df27bb8a4ba9